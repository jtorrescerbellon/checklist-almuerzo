<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f5f0"><title>Mi checklist · Almuerzo</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f5f0;color:#23362e;font:16px system-ui,sans-serif}main{max-width:680px;margin:auto;padding:22px 16px 60px}h1{font-size:29px;letter-spacing:-1px;margin:5px 0}p{margin:8px 0;color:#65736a}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:800;color:#637969}.panel,details{background:white;border:1px solid #e2e5de;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #26392c08}.stats{display:flex;justify-content:space-between;gap:8px}.stats div{flex:1}.stats b{font-size:27px;display:block}.stats small{color:#65736a}.track{height:9px;background:#e7ede7;border-radius:10px;overflow:hidden;margin:14px 0}.fill{height:100%;background:#367b59;transition:width .2s}.filters{display:flex;gap:6px;margin:16px 0}button{font:inherit;cursor:pointer;border:1px solid #dce3db;background:white;color:#294637;border-radius:10px;padding:10px 12px;min-height:42px}button.active,.primary{background:#326449;color:white;border-color:#326449}.filters button{flex:1;font-size:14px}summary{cursor:pointer;font-weight:700;display:flex;align-items:center;gap:8px;list-style:none}summary::-webkit-details-marker{display:none}summary:before{content:'›';font-size:24px;color:#65816d}details[open] summary:before{transform:rotate(90deg)}summary span:first-of-type{flex:1}summary small{color:#65736a;font-weight:500;white-space:nowrap}.task{display:flex;align-items:center;gap:10px;border-top:1px solid #edf0eb;padding:10px 0;min-height:56px}.task:first-child{margin-top:12px}.task label{display:flex;align-items:center;gap:12px;flex:1;cursor:pointer;line-height:1.4}input[type=checkbox]{width:23px;height:23px;flex:none;accent-color:#367b59;cursor:pointer}.done label span{text-decoration:line-through;color:#879389}.edit{padding:5px 9px;font-size:13px;color:#65736a}.add{width:100%;border-style:dashed;margin-top:9px;font-size:14px}.tools{display:flex;flex-wrap:wrap;gap:8px}.notice{font-size:12px;color:#65736a}.warning{color:#a33422}dialog{border:1px solid #dce3db;border-radius:16px;width:min(92%,420px);padding:20px}dialog::backdrop{background:#0006}dialog input{width:100%;padding:12px;border:1px solid #cbd7ce;border-radius:8px;font:inherit;margin:10px 0}dialog .tools{justify-content:flex-end}.danger{color:#a33422}#empty{display:none;text-align:center;padding:25px;color:#65736a}</style></head><body><main><div class="eyebrow">ORGANIZACIÓN PERSONAL</div><h1>Checklist del almuerzo</h1><p>47 invitados · 5 garzones · Iglesia</p><div class="panel"><div class="stats"><div><small>Completadas</small><b id="done">0</b></div><div><small>Pendientes</small><b id="left">0</b></div><div><small>Avance</small><b id="pct">0%</b></div></div><div class="track"><div class="fill" id="bar"></div></div><div id="status" class="notice" role="status">Guardado automático en este dispositivo</div></div><div class="filters" id="filters"><button data-f="all" class="active">Todas</button><button data-f="pending">Pendientes</button><button data-f="done">Listas</button></div><div id="sections"></div><div id="empty">No hay tareas en esta vista.</div><div class="panel"><strong>Respaldo y configuración</strong><p class="notice">Guarda una copia para recuperar tu avance o llevarlo a otro celular.</p><div class="tools"><button id="export">Guardar respaldo</button><button id="import">Recuperar respaldo</button><button id="reset" class="danger">Reiniciar avance</button></div><input type="file" id="file" accept="application/json,.json" hidden></div></main><dialog id="editor"><form id="editForm"><strong id="editTitle">Editar tarea</strong><input id="taskText" required maxlength="250" aria-label="Nombre de la tarea"><div class="tools"><button type="button" id="delete" class="danger">Eliminar</button><button type="button" id="cancel">Cancelar</button><button type="submit" class="primary">Guardar</button></div></form></dialog><script>
const initial=[{"name": "Coordinación de garzones", "tasks": [{"text": "Recordar celulares cargados", "done": false}, {"text": "Recordar uso de aplicación", "done": false}, {"text": "Explicar cronograma", "done": false}]}, {"name": "Búsqueda de materiales", "tasks": [{"text": "Buscar loza", "done": false}, {"text": "Buscar platos de entrada", "done": false}, {"text": "Buscar platos de fondo", "done": false}, {"text": "Buscar platos de postre", "done": false}, {"text": "Buscar servicios", "done": false}, {"text": "Buscar vasos", "done": false}, {"text": "Buscar copas", "done": false}, {"text": "Buscar saleros", "done": false}, {"text": "Buscar servilleteros", "done": false}, {"text": "Buscar manteles", "done": false}, {"text": "Buscar floreros", "done": false}, {"text": "Buscar jarras de jugo", "done": false}, {"text": "Buscar jarros de hielo", "done": false}]}, {"name": "Preparación de la iglesia", "tasks": [{"text": "Correr las sillas de la iglesia", "done": false}, {"text": "Retirar sillas que no se ocuparán", "done": false}, {"text": "Instalar mesas en forma de U", "done": false}, {"text": "Distribuir 47 sillas por el exterior de la U", "done": false}, {"text": "Poner manteles negros", "done": false}, {"text": "Poner floreros", "done": false}, {"text": "Preparar mesa de regalos del amigo secreto", "done": false}, {"text": "Preparar mesa afuera para loza sucia", "done": false}, {"text": "Preparar estación de recepción y stickers numerados", "done": false}]}, {"name": "Stand de cafetería", "tasks": [{"text": "Instalar mesa de cafetería", "done": false}, {"text": "Poner hervidor", "done": false}, {"text": "Poner percoladora", "done": false}, {"text": "Llenar hervidor con agua", "done": false}, {"text": "Llenar percoladora con agua", "done": false}, {"text": "Poner café en percoladora", "done": false}, {"text": "Poner bolsas de azúcar", "done": false}, {"text": "Poner endulzante", "done": false}, {"text": "Poner hierbas", "done": false}, {"text": "Poner bolsas de té", "done": false}, {"text": "Poner palillos revolvedores", "done": false}, {"text": "Poner cucharas para té", "done": false}, {"text": "Poner tazas", "done": false}, {"text": "Poner agua", "done": false}, {"text": "Instalar basurero con bolsa", "done": false}, {"text": "Guardar jugos cerca para rellenar", "done": false}]}, {"name": "Montaje de los 47 puestos", "tasks": [{"text": "Poner tenedores", "done": false}, {"text": "Poner cuchillos", "done": false}, {"text": "Poner cucharas grandes", "done": false}, {"text": "Poner cucharas pequeñas", "done": false}, {"text": "Poner vasos", "done": false}, {"text": "Poner servilletas de papel Abolengo", "done": false}, {"text": "Distribuir servilleteros", "done": false}, {"text": "Distribuir saleros", "done": false}, {"text": "Distribuir jarras de jugo", "done": false}, {"text": "Distribuir jarros de hielo", "done": false}, {"text": "Revisar los 47 puestos sin plato inicial", "done": false}]}, {"name": "Preparación de garzones", "tasks": [{"text": "Desayuno de garzones", "done": false}, {"text": "Colocarse mandiles", "done": false}, {"text": "Colocarse cofias", "done": false}, {"text": "Preparar guantes para cuando corresponda", "done": false}, {"text": "Llenar jarras de jugo", "done": false}, {"text": "Llenar jarros de hielo", "done": false}, {"text": "Confirmar distribución de invitados por garzón", "done": false}]}, {"name": "Recepción de invitados", "tasks": [{"text": "Asignar persona encargada de recepción", "done": false}, {"text": "Entregar stickers numerados", "done": false}, {"text": "Dar indicaciones a invitados", "done": false}, {"text": "Presentar a los garzones", "done": false}, {"text": "Explicar dinámica de atención", "done": false}, {"text": "Registrar personas a cargo en aplicación", "done": false}, {"text": "Entregar bandejas", "done": false}, {"text": "Explicar servicio de copas", "done": false}]}, {"name": "Servicio de almuerzo", "tasks": [{"text": "Servir entrada y copas", "done": false}, {"text": "Retirar state=structuredClone(initial),filter='all',opened=new Set([0]),editing=null;const $=id=>document.getElementById(id);try{const raw=localStorage.getItem(key);if(raw){const parsed=JSON.parse(raw);if(valid(parsed))state=parsed;}}catch(e){warn()}function valid(v){return Array.isArray(v)&&v.length===initial.length&&v.every(s=>typeof s.name==='string'&&Array.isArray(s.tasks)&&s.tasks.every(t=>typeof t.text==='string'&&typeof t.done==='boolean'))}function warn(){$('status').textContent='No se pudo acceder al guardado local. Usa Guardar respaldo.';$('status').classList.add('warning')}function save(){try{localStorage.setItem(key,JSON.stringify(state));$('status').textContent='Guardado automáticamente · '+new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});$('status').classList.remove('warning')}catch(e){warn()}}function el(tag,text,cls){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}function render(){let all=state.flatMap(s=>s.tasks),n=all.filter(t=>t.done).length,p=all.length?Math.round(n/all.length*100):0;$('done').textContent=n;$('left').textContent=all.length-n;$('pct').textContent=p+'%';$('bar').style.width=p+'%';$('sections').replaceChildren();let visible=0;state.forEach((s,i)=>{let list=s.tasks.map((t,j)=>({t,j})).filter(({t})=>filter==='all'||(filter==='done'?t.done:!t.done));if(!list.length&&filter!=='all')return;visible++;let d=el('details');d.open=opened.has(i)||filter!=='all';d.addEventListener('toggle',()=>{if(filter==='all'){if(d.open)opened.add(i);else opened.delete(i)}});let sum=el('summary');sum.append(el('span',s.name),el('small',s.tasks.filter(t=>t.done).length+'/'+s.tasks.length));d.append(sum);list.forEach(({t,j})=>{let r=el('div',undefined,'task'+(t.done?' done':'')),l=el('label'),c=el('input');c.type='checkbox';c.checked=t.done;c.onchange=()=>{t.done=c.checked;save();render()};l.append(c,el('span',t.text));let b=el('button','Editar','edit');b.onclick=()=>edit(i,j);r.append(l,b);d.append(r)});let a=el('button','+ Agregar tarea','add');a.onclick=()=>edit(i,null);d.append(a);$('sections').append(d)});$('empty').style.display=visible?'none':'block';document.querySelectorAll('[data-f]').forEach(b=>b.classList.toggle('active',b.dataset.f===filter))}function edit(i,j){editing={i,j};$('editTitle').textContent=j===null?'Agregar tarea':'Editar tarea';$('taskText').value=j===null?'':state[i].tasks[j].text;$('delete').hidden=j===null;$('editor').showModal()}$('editForm').onsubmit=e=>{e.preventDefault();let {i,j}=editing,t=$('taskText').value.trim();if(!t)return;if(j===null)state[i].tasks.push({text:t,done:false});else state[i].tasks[j].text=t;opened.add(i);save();$('editor').close();render()};$('cancel').onclick=()=>$('editor').close();$('delete').onclick=()=>{if(confirm('¿Eliminar esta tarea?')){state[editing.i].tasks.splice(editing.j,1);save();$('editor').close();render()}};$('filters').onclick=e=>{if(e.target.dataset.f){filter=e.target.dataset.f;render()}};$('reset').onclick=()=>{if(confirm('¿Desmarcar todas las tareas? Se conservarán las tareas editadas y agregadas.')){state.forEach(s=>s.tasks.forEach(t=>t.done=false));save();render()}};$('export').onclick=()=>{let a=el('a');let u=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.href=u;a.download='respaldo-checklist-almuerzo.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{try{let f=$('file').files[0];if(!f)return;let v=JSON.parse(await f.text());if(!valid(v))throw Error();if(confirm('¿Reemplazar el checklist actual con este respaldo?')){state=v;save();render()}}catch(e){alert('El archivo no es un respaldo válido.')}finally{$('file').value=''}};render();save();</script></body></html>
